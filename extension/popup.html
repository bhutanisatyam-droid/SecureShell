<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CallShield</title>
    <style>
      body { width: 320px; margin: 0; padding: 14px; font: 13px/1.4 system-ui, "Segoe UI", sans-serif; color: #111; }
      h1 { font-size: 16px; margin: 0 0 8px; }
      .status { padding: 8px 10px; border-radius: 8px; background: #f1f3f4; margin-bottom: 10px; white-space: pre-line; }
      .status.on { background: #e6f4ea; } .status.err { background: #fce8e6; }
      label { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; }
      input[type=text] { width: 100%; box-sizing: border-box; padding: 5px; }
      button { font: inherit; font-weight: 600; padding: 8px 12px; border-radius: 6px; border: 0; cursor: pointer; }
      #start { background: #1a73e8; color: #fff; } #stop { background: #d93025; color: #fff; }
      .row { display: flex; gap: 8px; margin: 10px 0; }
      details { margin-top: 8px; } small { color: #555; }
      a { color: #1a73e8; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>CallShield</h1>
    <div id="status" class="status">Loading…</div>
    <div class="row">
      <button id="start">Start monitoring this Meet tab</button>
      <button id="stop">Stop</button>
    </div>
    <label><input type="checkbox" id="micEnabled" /> <span>Also capture my microphone (labelled as <b>local</b>; use headphones) — <a id="grantMic">grant access</a></span></label>
    <label><input type="checkbox" id="autoDisconnect" /> <span>Allow automatic disconnect on corroborated critical risk (8s cancel window)</span></label>
    <label><input type="checkbox" id="keepChatOpen" /> <span>Open the Meet chat panel so chat messages can be read</span></label>
    <label><input type="checkbox" id="closeTabFallback" /> <span>If leaving fails, close this Meet tab</span></label>
    <details>
      <summary>Backend</summary>
      <label>URL <input type="text" id="backendUrl" /></label>
      <label>Token <input type="text" id="token" /></label>
    </details>
    <p><small>Monitors only the tab you start it on, only while you allow it. Settings apply on next start.</small></p>
    <script src="popup.js" type="module"></script>
  </body>
</html>
